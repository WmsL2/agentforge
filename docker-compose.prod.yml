# Supported lifecycle: explicit prod project/release/private file through Make.
# Compose >= 2.33.1; real runtime validation remains separately authorized.
x-production-environment: &production-environment
  ENVIRONMENT: production
  DEBUG: "false"
  DB_ECHO: "false"
  AGENTFORGE_ENV_FILE: none
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  API_KEY: ${API_KEY:?API_KEY is required}
  POSTGRES_HOST: db
  POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_PORT:?REDIS_PORT is required}
  REDIS_DB: ${REDIS_DB:?REDIS_DB is required}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  FLOWER_USER: ${FLOWER_USER:?FLOWER_USER is required}
  FLOWER_PASSWORD: ${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}

x-backend-service: &backend-service
  image: agentforge/${PROD_PROJECT:?PROD_PROJECT is required}-backend:${RELEASE_ID:?RELEASE_ID is required}
  pull_policy: never
  env_file:
    - ${PROD_ENV_FILE:?PROD_ENV_FILE is required}
  environment: *production-environment

x-business-dependencies: &business-dependencies
  migrate:
    condition: service_completed_successfully
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  app:
    <<: *backend-service
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?PYTHON_IMAGE is required}
        UV_IMAGE: ${UV_IMAGE:?UV_IMAGE is required}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - media_data:/app/media
    networks:
      backend-internal: {}
      provider-egress:
        gw_priority: 1
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    depends_on: *business-dependencies
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
        reservations: {cpus: '0.5', memory: 256M}

  migrate:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    networks:
      backend-internal: {}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  db:
    image: ${POSTGRES_IMAGE:?PostgreSQL 16 with pgvector image reference is required}
    command: ["postgres", "-p", "${POSTGRES_PORT:?POSTGRES_PORT is required}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend-internal: {}
    healthcheck:
      # TCP excludes PostgreSQL's temporary socket-only initialization server.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:?POSTGRES_USER is required}", "-d", "${POSTGRES_DB:?POSTGRES_DB is required}", "-p", "${POSTGRES_PORT:?POSTGRES_PORT is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}

  redis:
    image: ${REDIS_IMAGE:?Redis 7 image reference is required}
    command: ["redis-server", "--port", "${REDIS_PORT:?REDIS_PORT is required}", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT is required}
    volumes:
      - redis_data:/data
    networks:
      backend-internal: {}
    healthcheck:
      # REDISCLI_AUTH avoids echoing passwords; require both CLI success and PONG.
      test:
        - CMD-SHELL
        - 'reply=$$(REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning -h 127.0.0.1 -p "$$REDIS_PORT" ping) && [ "$$reply" = "PONG" ]'
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}

  celery_worker:
    <<: *backend-service
    command: celery -A app.worker.celery_app worker --loglevel=warning --concurrency=4
    volumes:
      - media_data:/app/media
    networks:
      backend-internal: {}
      provider-egress:
        gw_priority: 1
    depends_on: *business-dependencies
    healthcheck: {disable: true}
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits: {cpus: '0.5', memory: 512M}
        reservations: {cpus: '0.25', memory: 256M}

  celery_beat:
    <<: *backend-service
    command: celery -A app.worker.celery_app beat --loglevel=warning
    networks:
      backend-internal: {}
    depends_on: *business-dependencies
    healthcheck: {disable: true}
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: '0.25', memory: 128M}

  flower:
    <<: *backend-service
    command: celery -A app.worker.celery_app flower --port=5555
    environment:
      <<: *production-environment
      FLOWER_BASIC_AUTH: ${FLOWER_USER:?FLOWER_USER is required}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    networks:
      backend-internal: {}
    ports:
      - "${FLOWER_BIND_HOST:-127.0.0.1}:${FLOWER_HOST_PORT:-5555}:5555"
    depends_on: *business-dependencies
    healthcheck: {disable: true}
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: '0.25', memory: 128M}

  frontend:
    image: agentforge/${PROD_PROJECT:?PROD_PROJECT is required}-frontend:${RELEASE_ID:?RELEASE_ID is required}
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUN_IMAGE: ${BUN_IMAGE:?BUN_IMAGE is required}
        # Public browser inputs only. Backend runtime credentials never enter build args.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB: ${NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB:-50}
        NEXT_PUBLIC_RAG_ENABLED: "false"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://app:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    networks:
      backend-internal: {}
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      <<: *business-dependencies
      app:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}

networks:
  backend-internal:
    driver: bridge
    internal: true
  provider-egress:
    driver: bridge
    internal: false

volumes:
  media_data:
  postgres_data:
  redis_data:
