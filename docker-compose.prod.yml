# Production configuration; TLS/network/image/migration hardening remains Atomic 3+.
# Use make prod (all production Make targets use --env-file backend/.env.prod).
# Shell interpolation overrides --env-file; the mapping below passes the SAME
# resolved connection/credential values to every role and infrastructure service.
# Never run compose config against real secrets: rendered output contains secrets.
x-production-environment: &production-environment
  ENVIRONMENT: production
  DEBUG: "false"
  DB_ECHO: "false"
  AGENTFORGE_ENV_FILE: none
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  API_KEY: ${API_KEY:?API_KEY is required}
  POSTGRES_HOST: db
  POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_PORT:?REDIS_PORT is required}
  REDIS_DB: ${REDIS_DB:?REDIS_DB is required}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  FLOWER_USER: ${FLOWER_USER:?FLOWER_USER is required}
  FLOWER_PASSWORD: ${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}

services:

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentforge_backend
    volumes:
      - media_data:/app/media
    env_file:
      - ./backend/.env.prod
    environment:
      <<: *production-environment
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    networks:
      - backend-internal
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M


  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    container_name: agentforge_db
    command: ["postgres", "-p", "${POSTGRES_PORT:?POSTGRES_PORT is required}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NO external ports - only accessible within backend-internal network
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:?POSTGRES_USER is required}", "-p", "${POSTGRES_PORT:?POSTGRES_PORT is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: agentforge_redis
    command: ["redis-server", "--port", "${REDIS_PORT:?REDIS_PORT is required}", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    # NO external ports - only accessible within backend-internal network
    volumes:
      - redis_data:/data
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:?REDIS_PORT is required}", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  celery_worker:
    image: agentforge_backend:dev
    volumes:
      - media_data:/app/media
    command: celery -A app.worker.celery_app worker --loglevel=warning --concurrency=4
    env_file:
      - ./backend/.env.prod
    environment:
      <<: *production-environment
    networks:
      - backend-internal
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  celery_beat:
    image: agentforge_backend:dev
    container_name: agentforge_celery_beat
    command: celery -A app.worker.celery_app beat --loglevel=warning
    env_file:
      - ./backend/.env.prod
    environment:
      <<: *production-environment
    networks:
      - backend-internal
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  flower:
    image: agentforge_backend:dev
    container_name: agentforge_flower
    command: celery -A app.worker.celery_app flower --port=5555
    env_file:
      - ./backend/.env.prod
    environment:
      <<: *production-environment
      FLOWER_BASIC_AUTH: ${FLOWER_USER:?FLOWER_USER is required}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    networks:
      - backend-internal
    ports:
      - "5555:5555"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined into the browser bundle at build time, so they
      # must be build args — an `environment:` entry cannot override them, and
      # changing one needs a rebuild (docker compose -f docker-compose.prod.yml
      # build --no-cache frontend). Every value here has to be reachable from
      # the BROWSER, not from inside the compose network.
      args:
        # No proxy in front, so the browser talks to the published ports.
        # Set PUBLIC_HOST to this host's address — the localhost default only
        # works when the browser runs on the Docker host itself.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${PUBLIC_HOST:-localhost}:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://${PUBLIC_HOST:-localhost}:8000}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://${PUBLIC_HOST:-localhost}:3000}
        - NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=${NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB:-50}
        - NEXT_PUBLIC_RAG_ENABLED=false
    container_name: agentforge_frontend
    environment:
      - NODE_ENV=production
      # Server-side only: resolved inside the compose network by the Next server.
      - BACKEND_URL=http://app:8000
      # The auth cookies are Secure in production, and a browser discards a
      # Secure cookie that arrives over plain HTTP — login then "works" while
      # every request after it is 401. Serve this over TLS, or set
      # COOKIE_SECURE=false if it really is http:// on a trusted network.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    networks:
      - backend-internal
    ports:
      - "3000:3000"
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  backend-internal:
    driver: bridge
    internal: true

volumes:
  media_data:
  postgres_data:
  redis_data:
