name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      - name: Run ruff check
        run: uv run --directory backend ruff check app tests cli

      - name: Run ruff format check
        run: uv run --directory backend ruff format app tests cli --check

      - name: Run ty
        run: uv run --directory backend ty check

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      - name: Run tests
        run: uv run --directory backend pytest tests/ -v --cov=app --cov-report=xml
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  atomic5-async-run-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentforge_v09_atomic5_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentforge_v09_atomic5_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentforge_v09_atomic5_verify

      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

      AGENTFORGE_RUN_POSTGRES_E2E: "1"
      AGENTFORGE_RUN_ASYNC_API_E2E: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      - name: Apply migrations and verify revision
        run: |
          uv run --directory backend alembic upgrade head
          current_revision="$(uv run --directory backend alembic current)"
          echo "$current_revision"
          test "$current_revision" = "0045_create_knowledge_vector_index (head)"

      - name: Run Atomic 5 PostgreSQL and async API E2E
        run: |
          uv run --directory backend pytest \
            tests/integration/workflow/test_async_run_submission_postgres.py \
            tests/integration/workflow/test_async_run_api_e2e.py \
            -v -rs --junitxml=atomic5-e2e.xml

          uv run --directory backend python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("atomic5-e2e.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          counts = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          print(f"Atomic 5 E2E JUnit counts: {counts}")
          expected = {"tests": 5, "failures": 0, "errors": 0, "skipped": 0}
          if counts != expected:
              print(f"Expected exactly: {expected}", file=sys.stderr)
              raise SystemExit(1)
          PY

