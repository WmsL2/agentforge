# Frontend container verification configuration.
#
# This file is NOT the normal AgentForge frontend development environment.
#
# Day-to-day frontend development:
#
#   cd frontend
#   bun run dev
#
# Container verification:
#
#   docker compose -f docker-compose.frontend.yml \
#     up -d --build --force-recreate frontend
#
# The frontend Dockerfile creates a production-style standalone Next.js image.
# Source code is copied into that image during build and is NOT bind-mounted.
# Therefore a fresh build is required whenever frontend source changes.
#
# The backend development stack must already be reachable on localhost:8000.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are baked into the browser bundle at build time.
        #
        # They must point to addresses reachable by the browser, not Docker
        # service names. Override PUBLIC_HOST when accessing AgentForge from
        # another machine.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${PUBLIC_HOST:-localhost}:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://${PUBLIC_HOST:-localhost}:8000}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://${PUBLIC_HOST:-localhost}:3000}
        - NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=50
        - NEXT_PUBLIC_RAG_ENABLED=false

    container_name: agentforge_frontend

    ports:
      - "3000:3000"

    environment:
      # Server-side only.
      #
      # Next.js route handlers execute inside this container and use this URL
      # to call the FastAPI backend running on the Docker host.
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8000}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Verification containers must never silently return after Docker Desktop
    # restarts. This prevents an old frontend image from unexpectedly taking
    # ownership of localhost:3000 during normal development.
    restart: "no"

    healthcheck:
      # The oven/bun image has no curl/wget, so use Bun's built-in fetch.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3